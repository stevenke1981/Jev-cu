# Explicit, pinned-source import for the shared Windows companion.
# No schedules, no moving source branch, no external credentials, no force-push.
name: Import pinned Windows companion
on:
  push:
    branches: [windows-native-support]
    paths: [.github/workflows/vendor-windows.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vendor:
    if: github.repository == 'stevenke1981/Jev-cu' && github.ref == 'refs/heads/windows-native-support'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: target
      - uses: actions/checkout@v4
        with:
          repository: stevenke1981/Jev-ocu
          ref: beb912150eee7c43af3066a958cd51ad614b92c3
          path: source
          persist-credentials: false
      - name: Import only Windows source and adapt existing provider
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = beb912150eee7c43af3066a958cd51ad614b92c3
          test "$(git -C target rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src, dst = Path('source/windows'), Path('target/windows')
          if any(p.is_symlink() for p in src.rglob('*')):
              raise RuntimeError('Unexpected source symlink')
          if dst.is_symlink():
              raise RuntimeError('Refuse destination symlink')
          shutil.copytree(src, dst, dirs_exist_ok=True)
          (dst / 'provider.mjs').write_text('''// Shared Windows companion, adapted to Jev-cu's existing OpenRouter wrapper.
          import { ask, DEFAULT_MODEL } from '../scripts/jev-decide.mjs';
          export const MODEL = DEFAULT_MODEL;
          export function askWindows(options) {
            return ask({ ...options, timeoutMs: 20000, maxRetries: 1,
              fetchImpl: (url, init) => fetch(url, { ...init, redirect: 'error',
                signal: options.signal ? AbortSignal.any([init.signal, options.signal]) : init.signal,
              }),
            });
          }
          ''', encoding='utf-8')
          (dst / 'SOURCE.md').write_text('Windows companion copied from stevenke1981/Jev-ocu commit beb912150eee7c43af3066a958cd51ad614b92c3. Only provider.mjs is adapted to Jev-cu. This source is pinned, not automatically updated.\n', encoding='utf-8')
          PY
          git -C target add -- windows
          if ! git -C target diff --cached --quiet; then
            git -C target config user.name 'github-actions[bot]'
            git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C target commit -m 'Vendor tested native Windows companion from pinned Jev-ocu source'
            git -C target push origin HEAD:windows-native-support
          fi
          echo "commit=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: vendor
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.vendor.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
